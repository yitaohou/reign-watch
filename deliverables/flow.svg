<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" width="760" height="1040" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B6470"/>
    </marker>
    <style>
      .box   { fill: #FFFFFF; stroke: #B9C1CB; stroke-width: 1.2; rx: 6; }
      .stage { fill: #F4F6F8; stroke: #B9C1CB; stroke-width: 1;   rx: 5; }
      .ext   { fill: #FFFFFF; stroke: #B9C1CB; stroke-width: 1.2; stroke-dasharray: 4 3; rx: 6; }
      .agent { fill: #E3EEF3; stroke: #1F5F7A; stroke-width: 1.4; rx: 8; }
      .exit  { fill: #FFFFFF; stroke: #D8DDE4; stroke-width: 1;   rx: 5; }
      .h { font-weight: 600; fill: #171B22; }
      .t { fill: #171B22; }
      .m { fill: #5B6470; font-size: 11px; }
      .k { fill: #1F5F7A; font-weight: 600; font-size: 11px; letter-spacing: .06em; }
      .ok { fill: #2E7D4F; font-weight: 600; }
      .warn { fill: #B3721B; font-weight: 600; }
      .line { stroke: #5B6470; stroke-width: 1.3; fill: none; marker-end: url(#a); }
      .thin { stroke: #B9C1CB; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <!-- 1 trigger -->
  <rect class="box" x="200" y="16" width="360" height="46"/>
  <text x="380" y="36" text-anchor="middle" class="h">Server tick  ·  or  “Check now”</text>
  <text x="380" y="52" text-anchor="middle" class="m">server/app.py starts one headless agent run</text>
  <path class="line" d="M380 62 V92"/>

  <!-- agent container -->
  <rect class="agent" x="40" y="92" width="680" height="716"/>
  <text x="56" y="112" class="k">AGENT  ·  claude -p  ·  skill regulatory-watch</text>

  <!-- 2 checking -->
  <rect class="stage" x="120" y="128" width="520" height="66"/>
  <text x="136" y="149" class="h">1  Checking</text>
  <text x="136" y="167" class="t">diff_source() on every watched URL</text>
  <text x="136" y="183" class="m">fetch  →  extract text or links  →  hash  →  compare with the last snapshot</text>

  <!-- sources feeding checking (dashed, from the right) -->
  <rect class="ext" x="470" y="212" width="170" height="44"/>
  <text x="555" y="230" text-anchor="middle" class="h">Public pages</text>
  <text x="555" y="246" text-anchor="middle" class="m">Fed · EUR-Lex · EIOPA</text>
  <path class="thin" d="M555 212 V194"/>

  <path class="line" d="M300 194 V292"/>

  <!-- 3 judging -->
  <rect class="stage" x="120" y="292" width="320" height="66"/>
  <text x="136" y="313" class="h">2  Judging</text>
  <text x="136" y="331" class="t">the agent reads the diff</text>
  <text x="136" y="347" class="m">material, or not?</text>

  <!-- exits to the right -->
  <path class="line" d="M440 325 H470"/>
  <rect class="exit" x="470" y="292" width="170" height="66"/>
  <text x="484" y="311" class="m">first sighting → <tspan class="t">baseline</tspan></text>
  <text x="484" y="329" class="m">unchanged → <tspan class="t">no_change</tspan></text>
  <text x="484" y="347" class="m">not material → <tspan class="warn">noise</tspan></text>
  <text x="555" y="374" text-anchor="middle" class="m">stop · reason + raw diff kept</text>

  <!-- material down -->
  <path class="line" d="M300 358 V430"/>
  <text x="312" y="398" class="m">material</text>

  <!-- 4 screening -->
  <rect class="stage" x="120" y="430" width="520" height="100"/>
  <text x="136" y="451" class="h">3  Screening</text>
  <text x="136" y="469" class="t">every company in the CRM, in this order:</text>
  <text x="136" y="487" class="m">CEO exclusion  →  segment  →  four ICP gates  →  the regulation’s own flag</text>
  <text x="136" y="505" class="m">→ <tspan class="ok">affected</tspan> or not affected, one reason each</text>
  <text x="136" y="521" class="m">a <tspan class="t">score</tspan> audit record for every affected FS account</text>

  <!-- HubSpot feeding screening (dashed, from the left) -->
  <rect class="ext" x="48" y="446" width="60" height="68"/>
  <text x="78" y="474" text-anchor="middle" class="h" font-size="11">Hub</text>
  <text x="78" y="488" text-anchor="middle" class="h" font-size="11">Spot</text>
  <text x="78" y="504" text-anchor="middle" class="m" font-size="9.5">read-only</text>
  <path class="thin" d="M108 480 H120"/>

  <path class="line" d="M300 530 V566"/>

  <!-- 5 writing -->
  <rect class="stage" x="120" y="566" width="520" height="150"/>
  <text x="136" y="587" class="h">4  Writing</text>
  <text x="136" y="605" class="t">emit_brief() once per affected account — the only way a brief becomes a file</text>
  <text x="152" y="629" class="m"><tspan class="t">write_audit</tspan> (create)   fails closed: no record, no brief</text>
  <text x="152" y="649" class="m"><tspan class="t">render</tspan>   section 1 shared · section 2 from that account’s record · one ask</text>
  <text x="152" y="669" class="m"><tspan class="t">brief_eval</tspan>   7 checks: citations · length · banned phrases · hashes · audit · send</text>
  <text x="152" y="689" class="m"><tspan class="t">handoff.json</tspan>   only on PASS  ·  approved_at: null  ·  send: false</text>
  <text x="136" y="708" class="m">→ one brief (HTML) + R-17 records per affected account</text>

  <!-- agent output line -->
  <text x="56" y="794" class="m">ends with one JSON block: result · judgment · per-source summary · affected / excluded · audit ids · briefs</text>

  <path class="line" d="M380 808 V842"/>

  <!-- 6 dashboard -->
  <rect class="box" x="120" y="842" width="520" height="70"/>
  <text x="380" y="864" text-anchor="middle" class="h">Dashboard  ·  localhost:8787</text>
  <text x="380" y="883" text-anchor="middle" class="m">Regulations  →  Checks  →  one Check (verdict · briefs · companies screened)  →  Brief</text>
  <text x="380" y="900" text-anchor="middle" class="m">live phase while running  ·  Audit page  ·  noise verdicts stay visible with their diff</text>
  <path class="line" d="M380 912 V946"/>

  <!-- 7 human -->
  <rect class="box" x="160" y="946" width="440" height="64"/>
  <text x="380" y="968" text-anchor="middle" class="h">Named human</text>
  <text x="380" y="987" text-anchor="middle" class="m"><tspan class="ok">Approve</tspan> — the brief’s named approver only     ·     <tspan class="warn">Kill</tspan> — CEO / CRO only</text>
  <text x="380" y="1003" text-anchor="middle" class="m">nothing is sent</text>
</svg>
