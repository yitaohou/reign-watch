<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reign Watch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{--bg:#F4F6F8;--surface:#fff;--surface-2:#EDF0F3;--ink:#171B22;--muted:#5B6470;--rule:#D8DDE4;--rule-strong:#B9C1CB;--accent:#1F5F7A;--accent-soft:#E3EEF3;--ok:#2E7D4F;--ok-soft:#E3F1E8;--warn:#B3721B;--warn-soft:#F7EBD8;--stop:#A33D3D;--stop-soft:#F6E3E3}
  @media(prefers-color-scheme:dark){:root{--bg:#12161B;--surface:#1A1F26;--surface-2:#222830;--ink:#E6EAEE;--muted:#9AA4B0;--rule:#2C333C;--rule-strong:#3E4750;--accent:#6FB3CF;--accent-soft:#1C3340;--ok:#6CC391;--ok-soft:#1B3527;--warn:#E0A756;--warn-soft:#3B2C14;--stop:#E08484;--stop-soft:#3E1F1F}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;padding:32px 28px 64px}
  .page{max-width:1080px;margin:0 auto;display:grid;gap:20px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
  .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
  h1{font:600 28px/1.15 "Source Serif 4",Georgia,serif;margin:2px 0 0}
  h2{font:600 12px/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px}
  h2 .n{color:var(--ink);margin-left:6px}
  .hright{display:flex;align-items:center;gap:20px}
  nav a{color:var(--muted);text-decoration:none;margin-left:16px;font-weight:500;padding-bottom:4px}
  nav a.on{color:var(--accent);border-bottom:2px solid var(--accent)}
  .me{display:flex;align-items:center;gap:8px}
  .me label,.bar .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
  select,input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule-strong);border-radius:4px;padding:5px 8px}
  input[type=number]{width:70px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:10px 16px}
  .bar .l{margin-right:6px}
  .spacer{flex:1}
  .sw{position:relative;width:38px;height:22px;border-radius:999px;background:var(--rule-strong);border:0;cursor:pointer;vertical-align:middle}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
  .sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]::after{left:19px}
  .sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn{font:500 13px/1 "IBM Plex Sans",sans-serif;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:4px;padding:7px 11px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent)} .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ok{color:var(--ok);background:var(--ok-soft)} .btn.danger{color:var(--stop);background:var(--stop-soft)}
  .killbar{background:var(--stop-soft);color:var(--stop);border:1px solid var(--stop);border-radius:6px;padding:10px 16px;font-weight:500;display:flex;gap:12px;align-items:center}
  .testbar{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .testbar b{letter-spacing:.06em;text-transform:uppercase;font-size:12px} .testbar .exp{color:var(--ink);font-size:12.5px;max-width:70ch} .testbar .btn{color:var(--warn);background:var(--surface)}
  .table-wrap{background:var(--surface);border:1px solid var(--rule);border-radius:6px;overflow-x:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:720px}
  thead th{background:var(--surface-2);color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule-strong)}
  td{padding:12px 14px;vertical-align:top;border-bottom:1px solid var(--rule)}
  tr:last-child td{border-bottom:0}
  tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
  .id{font:500 13px/1.3 "IBM Plex Mono",ui-monospace,Menlo,monospace}
  .title{color:var(--muted);font-size:12.5px;display:block;margin-top:2px;max-width:44ch}
  .mono{font:12px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--muted)}
  .num{font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
  .p-no_change,.p-baseline,.p-never,.p-screened_none,.p-excluded{background:var(--surface-2);color:var(--muted)}
  .p-noise,.p-pending{background:var(--warn-soft);color:var(--warn)}
  .p-brief_emitted,.p-approved,.p-affected{background:var(--ok-soft);color:var(--ok)}
  .p-error,.p-killed{background:var(--stop-soft);color:var(--stop)} .p-running{background:var(--accent-soft);color:var(--accent)}
  .why{max-width:52ch;color:var(--muted);font-size:12.5px}
  a{color:var(--accent)}
  .empty{color:var(--muted);padding:28px 16px;text-align:center}
  .crumb{margin:0;color:var(--muted)} .crumb a{text-decoration:none}
  .stack{display:grid;gap:22px}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;display:grid;gap:10px}
  .card p{margin:0;max-width:80ch}
  .card h3{margin:0;font:600 14px/1.3 "IBM Plex Sans",sans-serif}
  ul.changes{margin:0;padding-left:18px;font-size:13px} ul.changes li{margin:2px 0}
  .backdrop{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
  .modal{background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong);border-radius:8px;width:min(860px,100%);max-height:88vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  .modal header{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px} .modal header .id{font-size:14px}
  .modal header .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
  .modal pre{margin:0;padding:18px;overflow:auto;font:12.5px/1.55 "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--ink)}
  .modal pre .k{color:var(--accent)} .modal pre .s{color:var(--ok)} .modal pre .b{color:var(--warn)} .modal pre .z{color:var(--muted)}
  .chooser{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:10px}
  .testwrap{border-top:1px solid var(--rule);padding-top:14px}
  .foot{color:var(--muted);font:12px/1.6 "IBM Plex Mono",ui-monospace,Menlo,monospace} .foot a{margin-right:12px}
</style>
</head>
<body>
<div class="page">
  <header>
    <div><div class="eyebrow">iTmethods · Reign · regulatory trigger watch</div><h1 id="h1">Reign Watch</h1></div>
    <div class="hright">
      <nav><a href="#/" id="nav-w">Regulations</a><a href="#/audit" id="nav-a">Audit</a></nav>
      <div class="me"><label for="me">Acting as</label><select id="me"></select></div>
    </div>
  </header>

  <div id="testbar" hidden class="testbar"></div>
  <div id="kill" hidden class="killbar"></div>

  <div class="bar">
    <span><span class="l">Every</span><input type="number" id="interval" min="0.05" step="0.5"> <span class="mono">h</span> <button class="btn" id="applyint" disabled>Apply</button></span>
    <span class="mono" id="clock"></span>
    <span class="spacer"></span>
    <button class="btn" id="runall">Check all</button>
    <button class="btn danger" id="killbtn" hidden>Kill motion</button>
  </div>

  <section id="view"></section>
  <div class="testwrap" id="testwrap"><button class="btn" id="testbtn">Test mode…</button><div class="chooser" id="chooser" hidden></div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const api = (p, body) => fetch(p, body ? {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)} : {}).then(r => r.json());
const fmt = iso => iso ? iso.replace('T',' ').replace('+00:00','Z') : '—';
const pill = (r, label) => `<span class="pill p-${r}">${label || (r||'—').replace(/_/g,' ')}</span>`;
const clean = s => (s || '').replace(/ \(mock.*$/,'');
const T = s => (S && S.test ? 'TEST · ' : '') + s;
let S = null, ME = null;
try { ME = localStorage.getItem('reign-me'); } catch (e) {}
const me = () => S && S.directory[ME] ? {id: ME, ...S.directory[ME]} : null;

window.addEventListener('hashchange', render);
async function refresh(){ S = await api('/api/state'); paintHeader(); render(); }

function paintHeader(){
  const sel = $('#me');
  if (!sel.options.length){ Object.entries(S.directory).forEach(([id,h]) => sel.add(new Option(`${h.name} · ${h.role}`, id))); if (!ME || !S.directory[ME]) ME = 'hum-006'; sel.value = ME; }
  if (document.activeElement !== $('#interval')) $('#interval').value = S.interval_hours;
  $('#interval').disabled = !!S.test;
  $('#clock').textContent = fmt(S.now);
  const tb = $('#testbar');
  if (S.test){ tb.hidden = false; $('#testwrap').hidden = true;
    tb.innerHTML = `<b>Test mode · scenario ${S.test.id}</b><span class="mono">baselines: ${S.test.label}</span><span class="exp">Expected: ${S.test.expect}</span><span class="spacer"></span><span class="mono">state: ${S.runs_dir}/ · scheduler off</span><button class="btn" id="exittest">Exit test mode</button>`;
    $('#exittest').onclick = async () => { const r = await api('/api/test/exit', {}); if (r.detail) alert(r.detail); $('#chooser').hidden = true; location.hash = '#/'; refresh(); };
  } else { tb.hidden = true; $('#testwrap').hidden = false; }
  const m = me(); $('#killbtn').hidden = !(m && m.can_kill);
  const k = $('#kill');
  if (S.killed){ k.hidden = false; k.innerHTML = `Motion killed by <b>${S.killed.name}</b> at ${fmt(S.killed.at)} — nothing runs.<span class="spacer"></span>${m && m.can_kill ? '<button class="btn" id="unkill">Lift kill</button>' : '<span class="mono">only CEO / CRO can lift it</span>'}`;
    const u = $('#unkill'); if (u) u.onclick = async () => { await api('/api/unkill', {by: ME}); refresh(); }; }
  else k.hidden = true;
  $('#foot').innerHTML = `<a href="/api/audit" target="_blank">audit log (json)</a> state: ${S.runs_dir}/ · agent: claude -p + reign-tools MCP + HubSpot MCP (read-only)`;
}
$('#me').onchange = e => { ME = e.target.value; try { localStorage.setItem('reign-me', ME); } catch (err) {} paintHeader(); render(); };
$('#interval').oninput = () => { $('#applyint').disabled = parseFloat($('#interval').value) === S.interval_hours; };
$('#applyint').onclick = async () => { await api('/api/interval', {hours: parseFloat($('#interval').value)}); $('#applyint').disabled = true; refresh(); };
$('#runall').onclick = async () => { $('#runall').disabled = true; await api('/api/run-all', {}); setTimeout(() => { $('#runall').disabled = false; refresh(); }, 800); };
$('#killbtn').onclick = async () => { if (confirm(`Kill the whole motion as ${me().name}? Nothing will run until lifted.`)) { const r = await api('/api/kill', {by: ME}); if (r.detail) alert(r.detail); refresh(); } };
$('#testbtn').onclick = () => { const c = $('#chooser'); c.hidden = !c.hidden; if (!c.hidden) { c.innerHTML = S.scenarios.map(s => `<div class="card"><h3>Scenario ${s.id}</h3><div class="mono">${s.label}</div><div class="why" style="max-width:none">${s.expect}</div><div><button class="btn" data-scenario="${s.id}">Enter scenario ${s.id}</button></div></div>`).join('') +
  `<div class="card"><h3>What test mode does</h3><div class="why" style="max-width:none">Copies today's snapshots into a separate state tree (<code>artifact/runs-test/</code>), then replaces the index-page baselines with real Wayback Machine captures from the dates shown. A check then compares today's live pages against those older baselines — replaying changes that actually happened. Normal mode's records, briefs and audit log are untouched. Scheduler is off; you press Check.</div></div>`;
  c.querySelectorAll('[data-scenario]').forEach(b => b.onclick = async () => { b.disabled = true; const r = await api('/api/test/enter', {scenario: b.dataset.scenario}); if (r.detail) { alert(r.detail); b.disabled = false; return; } location.hash = '#/'; refresh(); }); } };

// ---------------------------------------------------------------- router
async function render(){
  if (!S) return;
  const h = location.hash || '#/';
  const isAudit = h.startsWith('#/audit');
  document.querySelector('.bar').hidden = !(h === '#/' || h === '' || h === '#');   // interval · clock · Check all · Kill live on the Regulations page only
  $('#nav-w').className = isAudit ? '' : 'on'; $('#nav-a').className = isAudit ? 'on' : '';
  let m;
  if (isAudit) return renderAudit();
  if ((m = h.match(/^#\/watch\/(.+)$/))) return renderChecks(decodeURIComponent(m[1]));
  if ((m = h.match(/^#\/check\/([^/]+)\/(.+)$/))) return renderCheck(decodeURIComponent(m[1]), decodeURIComponent(m[2]));
  return renderWatches();
}

// ---------------------------------------------------------------- level 1: regulations
function renderWatches(){
  $('#h1').textContent = T('Reign Watch');
  $('#view').innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Regulation</th><th>On</th><th>Last check</th><th>Status</th><th class="num">Checks · briefs</th><th></th></tr></thead>
    <tbody>${S.watches.map(w => `<tr class="click" data-id="${w.id}">
      <td><span class="id">${w.id}</span><span class="title">${w.title||''}</span></td>
      <td><button class="sw" role="switch" aria-checked="${w.enabled}" data-toggle="${w.id}"></button></td>
      <td class="mono">${fmt(w.last_run)}${w.next_run ? `<br><span style="opacity:.7">next ${w.next_run === 'after first manual check' ? w.next_run : fmt(w.next_run)}</span>` : ''}</td>
      <td>${w.running ? `${pill('running', w.phase?.label || 'running')}<div class="why">${w.phase?.detail || ''}</div>` : (w.last ? pill(w.last.result) : pill('never'))}${w.last && !w.running ? `<div class="why">${(w.last.judgment||'').slice(0,110)}</div>` : ''}</td>
      <td class="num mono">${w.runs} · ${w.briefs}</td>
      <td><button class="btn" data-run="${w.id}" ${w.running?'disabled':''}>Check now</button></td>
    </tr>`).join('')}</tbody></table></div>`;
  const v = $('#view');
  v.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async e => { e.stopPropagation(); await api(`/api/watch/${b.dataset.toggle}`, {enabled: b.getAttribute('aria-checked') !== 'true'}); refresh(); });
  v.querySelectorAll('[data-run]').forEach(b => b.onclick = async e => { e.stopPropagation(); b.disabled = true; await api(`/api/run/${b.dataset.run}`, {}); setTimeout(refresh, 800); });
  v.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => location.hash = `#/watch/${encodeURIComponent(tr.dataset.id)}`);
}

// ---------------------------------------------------------------- level 2: all checks for one regulation
async function renderChecks(id){
  const w = S.watches.find(x => x.id === id); const rows = await api(`/api/activity/${encodeURIComponent(id)}`);
  $('#h1').textContent = T(`Checks · ${id}`);
  const counts = r => { const a = r.accounts; if (!a) return '—'; return `${(a.affected||[]).length} affected · ${(a.excluded||[]).length} not`; };
  const nb = r => (Array.isArray(r.brief) ? r.brief : (r.brief ? [r.brief] : [])).length;
  $('#view').innerHTML = `<p class="crumb"><a href="#/">← regulations</a> · ${w ? w.title : ''}</p>
    <div class="table-wrap"><table>
      <thead><tr><th>When</th><th>Result</th><th>Summary</th><th>Companies</th><th class="num">Briefs</th></tr></thead>
      <tbody>${rows.length ? rows.map(r => `<tr class="click" data-ts="${r.ts}">
        <td class="mono">${fmt(r.ts)}<br><span style="opacity:.7">${r.reason} · ${r.duration_s ?? '—'}s</span></td>
        <td>${pill(r.result)}</td>
        <td class="why">${(r.judgment||'').slice(0,160)}</td>
        <td class="mono">${counts(r)}</td>
        <td class="num mono">${nb(r)}</td>
      </tr>`).join('') : `<tr><td colspan="5" class="empty">No checks yet. Press Check now.</td></tr>`}</tbody></table></div>`;
  $('#view').querySelectorAll('tr.click').forEach(tr => tr.onclick = () => location.hash = `#/check/${encodeURIComponent(id)}/${encodeURIComponent(tr.dataset.ts)}`);
}

// ---------------------------------------------------------------- level 3: one check — changes, screened companies, briefs
async function renderCheck(trig, ts){
  const d = await api(`/api/check/${encodeURIComponent(trig)}/${encodeURIComponent(ts)}`); const c = d.cycle, who = me();
  if (!c) { $('#view').innerHTML = '<p class="empty">Record not found.</p>'; return; }
  $('#h1').textContent = T(`Check · ${c.trigger} · ${fmt(ts)}`);
  const aff = (d.accounts.affected||[]), exc = (d.accounts.excluded||[]);
  const changes = (c.changes||[]).map(ch => `<li>${ch.changed ? '●' : '○'} <a href="${ch.url}" target="_blank">${ch.url.replace(/^https?:\/\//,'').slice(0,64)}</a>${ch.watch_index ? ' <span class="mono">index</span>' : ''}${ch.summary ? ` — <span class="why" style="display:inline">${ch.summary}</span>` : ''}</li>`).join('');
  const briefRow = b => { const approved = !!b.approved_at, isApprover = who && who.id === b.approver.id; return `<tr class="click" data-audit="${b.audit_id}">
      <td><b>${clean(b.object_label) || b.object}</b><br><span class="mono">${b.object}</span></td>
      <td class="mono">${fmt(b.generated_at)}</td>
      <td>${approved ? `${pill('approved')}<div class="why">${S.directory[b.approved_by]?.name || b.approved_by} · ${fmt(b.approved_at)}</div>` : `${pill('pending')}<div class="why">approver: ${b.approver.name}</div>`}</td>
      <td class="mono">${b.audit_id}</td>
      <td style="white-space:nowrap" data-stop><a class="btn" href="${b.brief_url}" target="_blank" rel="noopener">Open brief</a>
        ${approved ? '' : `<button class="btn ok" data-approve="${b.run}" ${isApprover ? '' : 'disabled'} title="${isApprover ? 'Approve as ' + who.name : 'Switch “Acting as” to ' + b.approver.name + ' to approve'}">Approve</button>`}</td></tr>`; };
  const screened = [...aff.map(a => ({...a, v:'affected'})), ...exc.map(a => ({...a, v:'excluded'}))];
  $('#view').innerHTML = `<p class="crumb"><a href="#/">regulations</a> › <a href="#/watch/${encodeURIComponent(c.trigger)}">${c.trigger}</a> › this check</p>
    <div class="stack">
      <div class="card">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${pill(c.result)}<span class="mono">${c.reason} · ${c.duration_s ?? '—'}s · mode ${c.mode || 'normal'}</span></div>
        <p>${c.judgment || ''}</p>
        <h2 style="margin-top:6px">Sources checked</h2><ul class="changes">${changes || '<li class="mono">none recorded</li>'}</ul>
        ${d.diffs.length ? `<div><button class="btn" id="showdiffs">Show raw diffs the agent saw (${d.diffs.length})</button></div>` : ''}
      </div>

      <section><h2>Briefs generated<span class="n">${d.briefs.length}</span></h2>
        <div class="table-wrap"><table>
          <thead><tr><th>Account</th><th>Generated</th><th>Approval</th><th>Audit</th><th></th></tr></thead>
          <tbody>${d.briefs.length ? d.briefs.map(briefRow).join('') : `<tr><td colspan="5" class="empty">No briefs from this check.</td></tr>`}</tbody></table></div>
        <p class="why" style="margin:8px 2px 0;max-width:none">Approval is the named-human gate before Campaign Manager may send. It sends nothing; the R-17 <code>message</code> record is written at send time. Click a row for the R-17 record.</p>
      </section>
      <section><h2>Companies screened<span class="n">${screened.length}</span><span class="mono" style="margin-left:10px">from HubSpot</span></h2>
        <div class="table-wrap"><table>
          <thead><tr><th>Company</th><th>Verdict</th><th>Reason</th><th>Score record</th></tr></thead>
          <tbody>${screened.length ? screened.map(a => `<tr>
            <td><b>${clean(a.name) || a.account_id || '—'}</b><br><span class="mono">${a.account_id || ''}${a.hubspot_id ? ' · hs ' + a.hubspot_id : ''}</span></td>
            <td>${pill(a.v, a.v === 'affected' ? 'affected' : 'not affected')}</td>
            <td class="why">${a.reason || ''}</td>
            <td class="mono">${a.v === 'affected' && a.audit_id ? a.audit_id : '—'}</td></tr>`).join('') : `<tr><td colspan="4" class="empty">${c.result === 'brief_emitted' || c.result === 'screened_none' ? 'No companies recorded.' : 'No screening — this check found no material change, so HubSpot was not consulted.'}</td></tr>`}</tbody></table></div>
      </section>

    </div>`;
  const v = $('#view');
  const sd = $('#showdiffs'); if (sd) sd.onclick = () => openJSON(`diffs · ${fmt(ts)}`, `${d.diffs.length} record(s) written by diff_source`, d.diffs);
  v.querySelectorAll('[data-approve]').forEach(b => b.onclick = async e => { e.stopPropagation(); b.disabled = true; const r = await api('/api/approve', {run: b.dataset.approve, by: ME}); if (r.detail) alert(r.detail); renderCheck(trig, ts); });
  v.querySelectorAll('[data-stop]').forEach(el => el.onclick = e => e.stopPropagation());
  v.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => openAudit(tr.dataset.audit));
}

// ---------------------------------------------------------------- audit page
async function renderAudit(){
  const rows = await api('/api/briefs'); const who = me();
  const pending = rows.filter(r => !r.approved_at), done = rows.filter(r => r.approved_at);
  $('#h1').textContent = T('Audit');
  const row = (r, reviewed) => `<tr class="click" data-audit="${r.audit_id}">
      <td><span class="id">${r.trigger}</span><span class="title">${clean(r.object_label) || r.object}</span></td>
      <td class="mono">${fmt(r.generated_at)}<br><span style="opacity:.7">${r.origin}</span></td>
      <td class="mono">${r.audit_id}</td>
      ${reviewed ? `<td>${pill('approved')}<div class="why">${S.directory[r.approved_by]?.name || r.approved_by} · ${fmt(r.approved_at)}</div></td>` : `<td>${pill('pending')}<div class="why">approver: ${r.approver.name}</div></td>`}
      <td style="white-space:nowrap" data-stop><a class="btn" href="${r.brief_url}" target="_blank" rel="noopener">Open brief</a>
        ${reviewed ? '' : `<button class="btn ok" data-approve="${r.run}" ${who && who.id === r.approver.id ? '' : 'disabled'} title="${who && who.id === r.approver.id ? 'Approve as ' + who.name : 'Switch “Acting as” to ' + r.approver.name + ' to approve'}">Approve</button>`}</td></tr>`;
  const table = (list, reviewed, empty) => `<div class="table-wrap"><table><thead><tr><th>Trigger · account</th><th>Generated</th><th>Audit id</th><th>${reviewed ? 'Reviewed' : 'Status'}</th><th></th></tr></thead>
      <tbody>${list.length ? list.map(r => row(r, reviewed)).join('') : `<tr><td colspan="5" class="empty">${empty}</td></tr>`}</tbody></table></div>`;
  $('#view').innerHTML = `<div class="stack">
    <section><h2>Awaiting review<span class="n">${pending.length}</span></h2>${table(pending, false, 'Nothing waiting.')}</section>
    <section><h2>Reviewed<span class="n">${done.length}</span></h2>${table(done, true, 'Nothing reviewed yet.')}</section>
    <p class="why" style="margin:0 2px">Click a row for the R-17 record.</p></div>`;
  const v = $('#view');
  v.querySelectorAll('[data-approve]').forEach(b => b.onclick = async e => { e.stopPropagation(); b.disabled = true; const r = await api('/api/approve', {run: b.dataset.approve, by: ME}); if (r.detail) alert(r.detail); renderAudit(); });
  v.querySelectorAll('[data-stop]').forEach(td => td.onclick = e => e.stopPropagation());
  v.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => openAudit(tr.dataset.audit));
}

// ---------------------------------------------------------------- modal
function hl(json){ return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/("(?:[^"\\]|\\.)*")(\s*:)?/g, (m, s, c) => c ? `<span class="k">${s}</span>${c}` : `<span class="s">${s}</span>`).replace(/\b(true|false)\b/g, '<span class="b">$1</span>').replace(/\bnull\b/g, '<span class="z">null</span>'); }
function openJSON(title, sub, data){
  const wrap = document.createElement('div'); wrap.className = 'backdrop';
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><header><span class="id">${title}</span><span class="mono">${sub}</span><button class="x" aria-label="Close">×</button></header><pre>${hl(JSON.stringify(data, null, 2))}</pre></div>`;
  const close = () => { wrap.remove(); document.removeEventListener('keydown', esc); }; const esc = e => { if (e.key === 'Escape') close(); };
  wrap.onclick = e => { if (e.target === wrap) close(); }; wrap.querySelector('.x').onclick = close; document.addEventListener('keydown', esc);
  document.body.appendChild(wrap); wrap.querySelector('.x').focus();
}
async function openAudit(id){ const d = await api(`/api/audit/${id}`); openJSON(id, `R-17 record · ${d.audit_record?.action} · ${d.audit_record?.object}`, d); }

refresh(); setInterval(() => { if (!document.querySelector('.backdrop')) refresh(); }, 8000);
</script>
